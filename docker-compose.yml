# База данных сайта: PostgreSQL 17 + pgvector (решения.md, 4.1).
# Пароли — в .env (шаблон — .env.example).
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: bookmind-db
    restart: unless-stopped
    # Разделяемая память для параллельной сборки HNSW-индексов pgvector (в Docker по умолчанию 64 МБ)
    shm_size: 1gb
    # Кэш базы: HNSW-индекс векторов — 1,6 ГБ, при 128 МБ по умолчанию первый смысловой запрос в новой области шёл
    # 1–2,4 с (решения.md 4.9). 1 ГБ — больше не даём, ML-части нужна память. pg_prewarm/autoprewarm запоминает горячие
    # страницы и возвращает их в кэш после перезапуска
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=4GB
      -c shared_preload_libraries=pg_prewarm
      -c pg_prewarm.autoprewarm=true
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
